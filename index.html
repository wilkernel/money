
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Cash — Big Problem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --red: #ff304f;
    --green: #00ff9c;
    --white: #f5f5f5;
    --muted: #777;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100svh;
    overflow: hidden;
    background: #050505;
    color: var(--white);
    font-family: 'Orbitron', sans-serif;
    display: grid;
    place-items: center;
}

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 45%, #202020 0%, #090909 45%, #020202 100%);
    z-index: -3;
}

.glow {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: var(--red);
    filter: blur(180px);
    opacity: .09;
    animation: glowMove 8s infinite alternate;
    z-index: -2;
}

.grid {
    position: fixed;
    inset: 0;
    opacity: .12;
    background-image:
        linear-gradient(#777 1px, transparent 1px),
        linear-gradient(90deg, #777 1px, transparent 1px);
    background-size: 55px 55px;
    mask-image: linear-gradient(transparent, black, transparent);
    z-index: -1;
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

.container {
    width: min(100%, 850px);
    padding: 25px;
    text-align: center;
    position: relative;
}

.tag {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 6px;
    margin-bottom: 45px;
    animation: fadeIn 1s both;
}

.messages {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

.message {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(23px, 5vw, 43px);
    font-weight: 700;
    letter-spacing: -1.5px;
    opacity: 0;
    transform: translateY(25px);
    animation: reveal 1s forwards;
}

.message:nth-child(1) { animation-delay: 1s; }
.message:nth-child(2) { animation-delay: 3.5s; }
.message:nth-child(3) { animation-delay: 6s; }

.message .question {
    color: #fff;
}

.message .answer {
    color: #777;
}

.message.problem {
    color: var(--red);
    text-shadow: 0 0 25px #ff304f55;
}

.message.problem .answer {
    color: var(--red);
}

.animation {
    height: 220px;
    margin: 25px auto 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.brain {
    font-size: 105px;
    position: absolute;
    filter: drop-shadow(0 0 22px #9b4dff);
    animation: brainPulse 3s infinite;
}

.heart {
    font-size: 62px;
    position: absolute;
    animation: heartOut 1.5s 9s forwards;
    filter: drop-shadow(0 0 20px #ff304f);
}

.money {
    position: absolute;
    font-size: 95px;
    opacity: 0;
    filter: drop-shadow(0 0 25px var(--green));
    animation: moneyIn 1.5s 10s forwards;
}

.money::after {
    content: "$";
    position: absolute;
    color: var(--green);
    font-size: 25px;
    font-weight: 900;
    top: 25px;
    left: 32px;
}

.final {
    margin-top: 5px;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: 1px;
    opacity: 0;
    animation: finalReveal 1.5s 11.5s forwards;
}

.final span {
    color: var(--green);
    text-shadow: 0 0 25px #00ff9c88;
}

.subtitle {
    margin-top: 22px;
    font-family: 'Space Grotesk', sans-serif;
    color: #666;
    font-size: 10px;
    letter-spacing: 5px;
    opacity: 0;
    animation: finalReveal 1s 12.5s forwards;
}

.line {
    height: 1px;
    width: 0;
    margin: 25px auto;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: lineGrow 1.5s 11.5s forwards;
}

@keyframes reveal {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes brainPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

@keyframes heartOut {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(0) rotate(180deg); }
}

@keyframes moneyIn {
    0% { opacity: 0; transform: scale(.1) rotate(-35deg); }
    65% { opacity: 1; transform: scale(1.35) rotate(10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes finalReveal {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes lineGrow {
    to { width: 75%; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes glowMove {
    from { transform: translate(-150px, -80px); }
    to { transform: translate(150px, 80px); }
}

@media (max-width: 600px) {
    .container { padding: 18px; }
    .tag { margin-bottom: 35px; letter-spacing: 3px; }
    .animation { height: 170px; }
    .brain { font-size: 85px; }
    .heart { font-size: 50px; }
    .money { font-size: 75px; }
    .subtitle { letter-spacing: 2px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="glow"></div>
<div class="grid"></div>
<div class="noise"></div>

<main class="container">

    <div class="tag">// LIFE PRIORITIES — 2026</div>

    <section class="messages">
        <div class="message">
            <span class="question">No friends?</span>
            <span class="answer"> No problem.</span>
        </div>

        <div class="message">
            <span class="question">No girlfriend?</span>
            <span class="answer"> No problem.</span>
        </div>

        <div class="message problem">
            <span>No cash?</span>
            <span class="answer"> Big Problem.</span>
        </div>
    </section>

    <div class="animation">
        <div class="brain">🧠</div>
        <div class="heart">❤️</div>
        <div class="money">💵</div>
    </div>

    <div class="final">
        MONEY IS <span>EVERYTHING.</span>
    </div>

    <div class="line"></div>

    <div class="subtitle">
        EMOTIONS OFF // FINANCIAL MODE ON
    </div>

</main>

<script>
const duration = 16000;

function restart() {
    document.body.classList.remove('restart');
    void document.body.offsetWidth;
    document.body.classList.add('restart');

    const animated = document.querySelectorAll(
        '.tag, .message, .heart, .money, .final, .subtitle, .line'
    );

    animated.forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
    });
}

setInterval(restart, duration);
</script>

</body>
</html>
